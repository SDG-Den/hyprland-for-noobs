# hyprland base config

## environments

# DO NOT TOUCH, complex shit.

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK
env = GDK_SCALE,1

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24

# Disable appimage launcher by default
env = APPIMAGELAUNCHER_DISABLE,1

# OZONE
env = OZONE_PLATFORM,wayland

# For KVM virtual machines
# env = WLR_NO_HARDWARE_CURSORS, 1
# env = WLR_RENDERER_ALLOW_SOFTWARE, 1

# NVIDIA https://wiki.hyprland.org/Nvidia/
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1
env = WLR_DRM_NO_ATOMIC,1

env = XCURSOR_SIZE,24

## autostart
exec-once = qs -c noctalia-shell
exec-once = ghostty
exec-once = hyprmod


## cursor

cursor {
    inactive_timeout = 30 # Time in seconds
}

# input

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}



## decoration

decoration {
    rounding = 10
    blur {
        # handles background blur for windows with transparency, higher size or higher passes gets different effects
        enabled = true
        size = 3
        passes = 3
    }
    shadow {
        # handles border shadows, can actually be used for glows too.
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1a99)
    }
    # make modals dim the screen
    dim_modal = true
    dim_strength = 0.2

    # set inactive windows to be slightly transparent
    inactive_opacity = 0.9

}

## general

general {

    # configures the gaps between windows 
    gaps_in = 5
    # configures the gaps between windows and the outer edge of the screen
    gaps_out = 10
    # changes the border thiccness
    border_size = 2

    #keep this as dwindle unless you want to suffer.
    layout = dwindle

    # allow resizing windows by grabbing the borders like in windows
    resize_on_border = true

    # prevent modals from blocking the underlaying application
    modal_parent_blocking = false
}

## misc

misc {

    # disables branding
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

## layout

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
    smart_resizing = true
}

## monitors

monitor=,preferred,auto,1


## bind

# set your main modifier key
$mainMod = SUPER

# sets noctalia IPC
$ipc = qs -c noctalia-shell ipc call
	
# window management
bind = $mainMod, T, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 50% 50% # Toggle between tiling and floating window
bind = $mainMod, F, fullscreen # Open the window in fullscreen
bind = $mainMod, Q, killactive # Close current window
bind = $mainMod SHIFT, Q, exit # Exit Hyprland
bind = $mainMod, P, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin # makes a window floating and pins it
bind = $mainMod SHIFT, P, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin && hyprctl dispatch tagwindow overlay # turn window into overlay

#program launchers
bind = $mainMod, RETURN, exec, ghostty # Open ghostty
bind = $mainMod, TAB, exec, ghostty # Open ghostty
bind = $mainMod, E, exec, nautilus ~ # Open file browser in your home dir
bind = $mainMod shift, E, exec, ghostty -e yazi # opens yazi
bind = $mainMod, B, exec, firefox # open firefox
bind = $mainMod, N, exec, obsidian # open notes
bind = $mainMod SHIFT, S, exec, hyprmod # open hyprmod settings

# core binds
bind = $mainMod, SPACE, exec, $ipc launcher toggle # toggles app launcher
bind = $mainMod, escape, exec, $ipc controlCenter toggle # toggles control center
bind = $mainMod, S, exec, $ipc settings toggle # toggles settings menu
bind = $mainMod, L, exec, $ipc lockScreen lock # locks screen
bind = $mainMod, V, exec, $ipc launcher clipboard # toggles clipboard
bind = $mainMod, R, exec, $ipc launcher command # run menu
bind = $MainMod SHIFT, space, exec, systemMonitor toggle # opens system monitor



# Audio Controls
bind = , XF86AudioRaiseVolume, exec, $ipc volume increase
bind = , XF86AudioLowerVolume, exec, $ipc volume decrease
bind = , XF86AudioMute, exec, $ipc volume muteOutput
bind = , XF86AudioMicMute, exec, $ipc volume muteInput

# Brightness Controls
bind = , XF86MonBrightnessUp, exec, $ipc brightness increase
bind = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# Other
bind = , XF86WLAN, exec, nmcli radio wifi toggle # toggle wifi
bind = , XF86Refresh, exec, xdotool key F5

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down

#swap windows using ctrl+mainmod+arrow keys
bind = $mainMod CONTROL, left, exec, hyprctl dispatch swapwindow l
bind = $mainMod CONTROL, right, exec, hyprctl dispatch swapwindow r
bind = $mainMod CONTROL, up, exec, hyprctl dispatch swapwindow u
bind = $mainMod CONTROL, down, exec, hyprctl dispatch swapwindow d
#resize windows using alt+mainmod+arrow keys 
binde = $mainMod ALT, left, exec, hyprctl dispatch resizeactive -50 0
binde = $mainMod ALT, right, exec, hyprctl dispatch resizeactive 50 0
binde = $mainMod ALT, up, exec, hyprctl dispatch resizeactive 0 -50
binde = $mainMod ALT, down, exec, hyprctl dispatch resizeactive 0 50

# move to this workspace
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #  Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #  Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #  Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #  Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #  Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #  Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #  Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #  Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #  Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #  Move window to workspace 10


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1 # Scroll workspaces 
bind = $mainMod, mouse_up, workspace, e-1 # Scroll workspaces

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow # Move window
bindm = $mainMod, mouse:273, resizewindow # Resize window

# enable smart split for just mouse moving
bind = $mainMod, mouse:272, exec, hyprctl keyword dwindle:smart_split 1 # turn on smart split on when super+lmb is pressed
bindr = $mainMod, mouse:272, exec, hyprctl keyword dwindle:smart_split 0 # toggles it back off when the buttons are released


source = ~/.config/hypr/hyprland-gui.conf